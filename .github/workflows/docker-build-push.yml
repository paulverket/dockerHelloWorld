name: Docker Build and Push

on:
  push:
    branches:
      - main
      - master
      - github-workflow
  pull_request:
    branches:
      - main
      - master
      - github-workflow
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Since the prompt didn't explicitly mandate self-hosted runner for GH actions, default to ubuntu-latest.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        # Skip login for PRs so it doesn't fail if secrets are PR-restricted
        if: github.event_name != 'pull_request' 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME || 'verket' }}/docker-hello-world:latest
